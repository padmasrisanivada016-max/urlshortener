# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=shortener
spring.datasource.password=shortener123

# JPA: create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Public address used in short links
app.base-url=http://localhost:8080/

# Rate limiting
rate-limit.window-seconds=60
rate-limit.shorten-limit=10
rate-limit.redirect-limit=100
